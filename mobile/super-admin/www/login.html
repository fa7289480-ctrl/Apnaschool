<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="Login to ApnaSchool.">
    <meta name="robots" content="noindex">
    <title>Login · ApnaSchool</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apnaschool-api-base" content="http://localhost:3001">
    <script type="module" crossorigin src="./assets/modulepreload-polyfill-P2Xu9kJm.js"></script>
    <script type="module" crossorigin src="./assets/main-C5qaUqjE.js"></script>
    <script type="module" crossorigin src="./assets/rolldown-runtime-XKyaHtl9.js"></script>
    <script type="module" crossorigin src="./assets/vendor-ui-B536-3nV.js"></script>
    <script type="module" crossorigin src="./assets/password-strength-CR79XtXF.js"></script>
    <script type="module" crossorigin src="./assets/api-client-z-oFFDhr.js"></script>
    <script type="module" crossorigin src="./assets/auth-aTW1NtIP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DVh9RSzO.css">
    <link rel="stylesheet" crossorigin href="./assets/inter-B_VMY_PD.css">
</head>
<body data-page="login">
    <div class="auth-layout">
        <main class="auth-main">
            <div class="auth-topbar">
                <a class="auth-brand" href="./index.html">
                    <span>ApnaSchool</span>
                </a>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-theme-toggle aria-label="Toggle colour theme">
                    <i class="bi bi-sun-fill theme-icon-light"></i>
                    <i class="bi bi-moon-fill theme-icon-dark d-none"></i>
                </button>
            </div>

            <div class="auth-body" x-data="loginForm()">
                <div class="auth-heading">
                    <h1>Login</h1>
                    <p>Apni ID aur password se login karein.</p>
                </div>

                <div class="alert alert-danger py-2 px-3 small" role="alert" x-show="failed" x-cloak x-text="message">
                    Login failed.
                </div>

                <form class="auth-form" @submit.prevent="submit" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="login-id">ID</label>
                        <input type="text" class="form-control" id="login-id" autocomplete="username"
                               x-model="form.email" :class="fieldClass('email')"
                               placeholder="PRI-0001 / TCH-0001 / STU-0001" required>
                        <div class="invalid-feedback" x-text="errors.email"></div>
                    </div>

                    <div class="mb-3">
                        <div class="form-label-row">
                            <label class="form-label" for="login-password">Password</label>
                            <a href="./forgot-password.html">Forgot?</a>
                        </div>
                        <div class="auth-password">
                            <input :type="showPassword ? 'text' : 'password'" class="form-control" id="login-password"
                                   autocomplete="current-password" x-model="form.password"
                                   :class="fieldClass('password')" placeholder="Password" required>
                            <button type="button" class="auth-password-toggle" @click="togglePassword"
                                    :aria-label="showPassword ? 'Hide password' : 'Show password'">
                                <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                            <div class="invalid-feedback" x-text="errors.password"></div>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="login-remember" x-model="form.remember">
                        <label class="form-check-label small" for="login-remember">Mujhe signed in rakhain</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" :disabled="submitting">
                        <span class="spinner-border spinner-border-sm me-2" x-show="submitting" x-cloak aria-hidden="true"></span>
                        <span x-text="submitting ? 'Login ho raha hai…' : 'Login'">Login</span>
                    </button>
                </form>

                <p class="auth-footnote text-muted small mt-3 mb-0">
                    ID Principal / Super Admin se milti hai.
                </p>
            </div>
            <footer class="auth-legal">Built by Ranjha Farhan</footer>
        </main>
    </div>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="apnaschool-api-base" content="http://localhost:3001"><title>Change temporary password — ApnaSchool</title></head><body><main class="container py-5" style="max-width:560px" x-data="changePasswordForm()"><h1>Change your temporary password</h1><p>You must set a new password before using your account.</p><div class="alert alert-danger" x-show="message" x-text="message" role="alert"></div><form @submit.prevent="submit"><div class="mb-3"><label for="current" class="form-label">Current temporary password</label><input id="current" class="form-control" type="password" autocomplete="current-password" x-model="currentPassword" required></div><div class="mb-3"><label for="new" class="form-label">New password (12+ characters)</label><input id="new" class="form-control" type="password" autocomplete="new-password" x-model="newPassword" minlength="12" required></div><div class="mb-3"><label for="confirm" class="form-label">Confirm new password</label><input id="confirm" class="form-control" type="password" autocomplete="new-password" x-model="confirmPassword" minlength="12" required></div><button class="btn btn-primary" type="submit" :disabled="submitting" x-text="submitting ? 'Saving…' : 'Change password'"></button></form></main><script type="module" src="./scripts/auth.js"></script><footer class="app-credit text-center small text-muted py-3">Built by Ranjha Farhan</footer></body></html>
